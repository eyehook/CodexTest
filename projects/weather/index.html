<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="An immersive snow and rain experiment for desktop and Meta Quest 3."><title>Weather Lab · Snowfall</title>
