<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mount Snow · WebXR</title>
  <link rel="stylesheet" href="./style.css?v=0.1.0">
</head>
<body>
  <main id="view" aria-label="Mount Snow terrain viewer"></main>
  <header class="panel">
    <a href="../../">All projects</a>
    <h1>Mount Snow <small id="version"></small></h1>
    <p id="status" role="status">Loading terrain…</p>
    <p id="controls" hidden>WASD to walk · arrows to look<br>Space to ski · hold to tuck · A/D to steer · E to pole push · Shift to brake</p>
    <p><a href="https://www.openstreetmap.org/copyright">Trail, lift and structure data © OpenStreetMap contributors</a></p>
    <p><a href="./audio/">Sound Audition</a></p>
    <button id="enter" type="button" hidden>Enter VR</button>
  </header>
  <script type="module" src="./app.mjs?v=0.1.76"></script>
</body>
</html>
