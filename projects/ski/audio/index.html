<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound Audition · Mount Snow</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./audition.mjs?v=0.1.67"></script>
</head>
<body>
  <main>
    <a href="../">← Mount Snow</a>
    <h1>Sound Audition</h1>
    <p>Play samples together to hear how they layer.</p>
    <button id="stop-all" type="button" disabled>Stop all</button>
    <p id="status" role="status">Loading samples…</p>
    <div id="library"></div>
    <footer id="sources"></footer>
  </main>
  <template id="sample">
    <article>
      <h3></h3>
      <p class="details"></p>
      <p class="processing"></p>
      <div class="controls">
        <button class="play" type="button">Play</button>
        <button class="stop" type="button" disabled>Stop</button>
        <label><input class="loop" type="checkbox"> Loop</label>
        <label>Volume <span class="volume-value"></span>
          <input class="volume" type="range" min="0" max="1" step="0.01">
        </label>
        <label>Rate <span class="rate-value"></span>
          <input class="rate" type="range" min="0.5" max="2" step="0.05">
        </label>
        <button class="reset" type="button">Reset</button>
      </div>
      <p class="status" role="status"></p>
    </article>
  </template>
</body>
</html>
